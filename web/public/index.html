<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#111916">
  <title>Turnline · 语音通话</title>
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a id="home" class="brand" href="/" aria-label="Turnline 首页"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Turnline</a>
      <div class="top-actions">
        <span id="backend-label" data-connection="checking" class="backend" role="status"><i aria-hidden="true"></i>正在连接</span>
        <button id="toggle-theme" type="button" class="button icon-button" aria-label="使用浅色主题" title="使用浅色主题">
          <span class="theme-sun" aria-hidden="true">☀</span><span class="theme-moon" aria-hidden="true">☾</span>
        </button>
        <button id="open-settings" type="button" class="button ghost">通话设置</button>
      </div>
    </div>
  </header>

  <main>
    <section id="connection-panel" class="connection-panel" aria-label="连接状态">
      <p id="connection-detail">正在检查连接。</p>
      <button id="retry-connection" type="button" class="button subtle" hidden>重试连接</button>
      <button id="setup-direct" type="button" class="button subtle" hidden>设置直连</button>
    </section>

    <div class="workspace">
      <section class="call" aria-labelledby="call-title">
        <div class="call-top">
          <h1 id="call-title">语音通话</h1>
          <div class="call-meta">
            <time id="duration">00:00</time>
            <button id="open-diagnostics" type="button" class="button icon-button" aria-label="通话诊断" title="通话诊断" aria-haspopup="dialog">
              <span class="info-icon" aria-hidden="true">i</span>
            </button>
          </div>
        </div>
        <div class="call-center">
          <div id="orb" class="orb" data-state="idle" aria-hidden="true">
            <div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <p id="status" class="status" role="status">准备通话</p>
          <p id="hint" class="hint">开麦后，说完一句稍作停顿即可发送。</p>
        </div>
        <div class="call-actions">
          <button id="call" type="button" class="button primary" disabled>开始通话</button>
          <div class="secondary-actions">
            <button id="mute" type="button" class="button outline" disabled>静音</button>
            <button id="interrupt" type="button" class="button outline" disabled>打断</button>
          </div>
        </div>
      </section>

      <section class="transcript" aria-labelledby="transcript-title">
        <header class="panel-heading">
          <h2 id="transcript-title">对话记录</h2>
          <div class="transcript-actions">
            <button id="toggle-composer" type="button" class="button subtle" aria-controls="composer" aria-expanded="false">文字输入</button>
            <button id="new-session" type="button" class="button subtle">新对话</button>
          </div>
        </header>
        <div id="messages" class="messages" role="log" aria-label="对话文字" aria-live="polite">
          <p id="empty" class="empty">通话内容会显示在这里。</p>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
        <form id="composer" class="composer" hidden>
          <label class="sr-only" for="message">文字消息</label>
          <input id="message" maxlength="12000" autocomplete="off" placeholder="输入文字消息" disabled>
          <button id="send-message" class="button send" type="submit" disabled>发送</button>
        </form>
      </section>
    </div>
  </main>

  <dialog id="diagnostics" aria-labelledby="diagnostics-title">
    <div class="diagnostics-content">
      <header class="panel-heading">
        <h2 id="diagnostics-title">通话诊断</h2>
        <button id="close-diagnostics" type="button" class="button subtle">关闭</button>
      </header>
      <div class="diagnostics-meta">
        <span id="models">SenseVoice · Matcha</span>
        <span id="trace-count">暂无通话计时</span>
      </div>
      <dl class="metrics">
        <div><dt>语音识别</dt><dd id="metric-asr">—</dd></div>
        <div><dt>请求到首字</dt><dd id="metric-text">—</dd></div>
        <div><dt>断句到首声</dt><dd id="metric-audio">—</dd></div>
        <div><dt>检测到开口至暂停</dt><dd id="metric-interruption">—</dd></div>
        <div><dt>断句到发起请求</dt><dd id="metric-endpoint-request">—</dd></div>
        <div><dt>后端回合排队</dt><dd id="metric-backend-queue">—</dd></div>
        <div><dt>请求到首段可播文本</dt><dd id="metric-speakable">—</dd></div>
        <div><dt>首字到可播</dt><dd id="metric-text-wait">—</dd></div>
        <div><dt>首次合成排队</dt><dd id="metric-queue">—</dd></div>
        <div><dt>合成到首块 PCM</dt><dd id="metric-synthesis">—</dd></div>
        <div><dt>首段文本到收到 PCM</dt><dd id="metric-pcm">—</dd></div>
        <div><dt>播报间隙累计</dt><dd id="metric-gaps">—</dd></div>
      </dl>
      <div class="dialog-actions"><button id="export-timing" type="button" class="button ghost" disabled>导出逐轮计时</button></div>
    </div>
  </dialog>

  <dialog id="settings">
    <form id="settings-form">
      <header class="panel-heading">
        <h2>通话设置</h2>
        <button id="close-settings" type="button" class="button subtle">关闭</button>
      </header>
      <div class="fields">
        <label>断句停顿
          <select id="silence">
            <option value="1">紧凑 · 1 秒</option>
            <option value="1.5">快速 · 1.5 秒</option>
            <option value="2.2" selected>自然 · 2.2 秒</option>
            <option value="3">从容 · 3 秒</option>
          </select>
        </label>
        <label>播报时机
          <select id="reading">
            <option value="live" selected>流式播报 · 超过 20 字开播</option>
            <option value="confirmed">确认正文后播报</option>
          </select>
        </label>
        <label class="checkbox"><input id="duplex" type="checkbox">允许在播报时开口打断</label>
        <label>补充通话指令
          <textarea id="instructions" rows="2" maxlength="3000" placeholder="例如，每次只说一个步骤"></textarea>
        </label>
      </div>
      <div class="dialog-actions">
        <a id="switch-mode" class="button subtle" href="/direct" hidden>浏览器直连</a>
        <button id="edit-direct" class="button subtle" type="button" hidden>直连设置</button>
        <button class="button primary" type="submit">保存设置</button>
      </div>
    </form>
  </dialog>
  <dialog id="direct-settings">
    <form id="direct-form">
      <header class="panel-heading">
        <h2>浏览器直连 Pipiclaw</h2>
        <button id="close-direct" class="button subtle" type="button">关闭</button>
      </header>
      <div class="fields">
        <label>Pipiclaw 地址
          <input id="direct-url" type="url" placeholder="https://pipi.local:8787" autocomplete="off" spellcheck="false" required>
        </label>
        <label>Pipiclaw Key
          <input id="direct-key" type="password" placeholder="pk_…" autocomplete="off" spellcheck="false" required>
        </label>
      </div>
      <p id="direct-error" class="error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button id="forget-direct" class="button subtle" type="button" hidden>清除 Key</button>
        <button id="test-direct" class="button primary" type="submit">测试并连接</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
